# Builds both versions on every push and pull request, so a change made while testing on one
# platform doesn't quietly break the other. The built apps are attached to each run.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: macos/build.sh   # no signing certificate here, so it signs ad-hoc
      - uses: actions/upload-artifact@v7
        with:
          name: JogScroll-macos
          path: build/macos

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build
        shell: pwsh
        run: windows/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: JogScroll-windows
          path: build/windows/*.exe
